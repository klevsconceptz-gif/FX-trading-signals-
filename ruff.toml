line-length = 120

[lint]
select = ["F", "E9", "I", "B", "SIM", "C4", "RUF"]
# RUF001-003 flag typographic math notation (×, −, σ) used intentionally
# in user-facing text and docstrings — not confusable-attack vectors.
# B008: FastAPI dependency injection (Depends(...) in signatures) is the framework idiom
ignore = ["RUF001", "RUF002", "RUF003", "B008"]
