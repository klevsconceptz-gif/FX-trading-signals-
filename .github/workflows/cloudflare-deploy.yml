# Deploys the Cloudflare route: D1 migrations, the API Worker, its secrets, and the Pages site.
#
# Build secrets: passwords and tokens are read from GitHub secrets of the `production` environment.
# They are passed to steps as environment variables and piped into `wrangler secret put` on stdin.
# They are never written to the repository, the build output, or a command line.
name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Also deploy the Pages site (dist/)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Worker tests
        run: npm run worker:test
      - name: Bootstrap script tests
        run: npm run cloudflare:bootstrap:test
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-live.txt ruff
      - name: Lint
        run: python -m ruff check fxbot tests
      - name: Python tests
        run: python -m pytest -q
      - name: Build the Pages site
        run: npm run build

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Reports whether the Cloudflare secrets reached this job. Prints lengths only, never values.
      - name: Check Cloudflare secrets are set
        run: |
          missing=0
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            v="${!n}"
            if [ -z "$v" ]; then
              echo "$n: EMPTY"
              echo "::error title=Cloudflare secret missing::$n is empty in the production environment"
              missing=1
            else
              ws=no; if [[ "$v" =~ [[:space:]] ]]; then ws=yes; fi
              echo "$n: set, length ${#v}, contains whitespace: $ws"
            fi
          done
          exit $missing

      # Finds or creates the D1 database, KV namespace and Pages project. Fails if the IDs in
      # worker/wrangler.jsonc do not match the account, so no deploy runs against the wrong resource.
      - name: Ensure Cloudflare resources exist
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        # --write-config updates the job's copy of worker/wrangler.jsonc when the D1/KV IDs differ
        # from this account, so the deploy steps below use the right IDs. Commit the result afterwards.
        run: npm run cloudflare:bootstrap -- --write-config

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply DB --remote --config worker/wrangler.jsonc

      - name: Deploy the API Worker
        # --keep-vars: keep the variables set in the Cloudflare dashboard. Without it, Wrangler deletes
        # every variable that is not in worker/wrangler.jsonc. Bindings come from the config file.
        run: npx wrangler deploy --config worker/wrangler.jsonc --keep-vars

      - name: Set Worker secrets from build secrets
        env:
          KFX_ADMIN_USERNAME: ${{ secrets.KFX_ADMIN_USERNAME }}
          KFX_ADMIN_PASSWORD: ${{ secrets.KFX_ADMIN_PASSWORD }}
          KFX_ADMIN_EMAIL: ${{ secrets.KFX_ADMIN_EMAIL }}
          KFX_ADMIN_PHONE: ${{ secrets.KFX_ADMIN_PHONE }}
          KLEVS_RESET_EMAIL_TOKEN: ${{ secrets.KLEVS_RESET_EMAIL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_POST_SECRET: ${{ secrets.TELEGRAM_POST_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$KFX_ADMIN_USERNAME$KFX_ADMIN_PASSWORD" ] && { [ -z "$KFX_ADMIN_USERNAME" ] || [ -z "$KFX_ADMIN_PASSWORD" ]; }; then
            u=no; [ -n "$KFX_ADMIN_USERNAME" ] && u=yes
            p=no; [ -n "$KFX_ADMIN_PASSWORD" ] && p=yes
            echo "::error title=Admin secrets incomplete::KFX_ADMIN_USERNAME and KFX_ADMIN_PASSWORD must both be set in the production environment. Username set: $u. Password set: $p."
            exit 1
          fi
          # Values go through stdin, never argv. Only the secret name is printed.
          put_secret() {
            if [ -z "$2" ]; then
              echo "skip $1 (build secret not set)"
              return 0
            fi
            if ! printf '%s' "$2" | npx wrangler secret put "$1" --config worker/wrangler.jsonc > /dev/null; then
              echo "::error title=Worker secret not set::Setting $1 on the Worker failed (see the step log above)"
              exit 1
            fi
            echo "set $1"
          }
          put_secret KFX_ADMIN_USERNAME "$KFX_ADMIN_USERNAME"
          put_secret KFX_ADMIN_PASSWORD "$KFX_ADMIN_PASSWORD"
          put_secret KFX_ADMIN_EMAIL "$KFX_ADMIN_EMAIL"
          put_secret KFX_ADMIN_PHONE "$KFX_ADMIN_PHONE"
          put_secret KLEVS_RESET_EMAIL_TOKEN "$KLEVS_RESET_EMAIL_TOKEN"
          put_secret TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
          put_secret TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"
          put_secret TELEGRAM_POST_SECRET "$TELEGRAM_POST_SECRET"

      - name: Deploy the Pages site
        if: ${{ inputs.deploy_pages }}
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -uo pipefail
          if [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "::error title=Pages deploy failed::CLOUDFLARE_PAGES_PROJECT is not set in the production environment."
            exit 1
          fi
          # Run from the repository root: Wrangler uploads the functions/ folder (the /api proxy)
          # that sits where the command runs, next to dist/. Its output goes to a file so the
          # reason can be shown as an annotation on the run page.
          npx wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" > /tmp/pages-deploy.log 2>&1
          status=$?
          cat /tmp/pages-deploy.log
          if [ "$status" != "0" ]; then
            reason=$(grep -v '^[[:space:]]*$' /tmp/pages-deploy.log | tail -n 3 | tr '\n' ' ' | cut -c1-400)
            echo "::error title=Pages deploy failed::wrangler exit $status: $reason"
            exit "$status"
          fi

      - name: Health check
        env:
          API_ORIGIN: ${{ vars.KLEVS_API_ORIGIN || 'https://fx-trading-signals.klevsconceptz.workers.dev' }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /tmp/health.json -w '%{http_code}' "$API_ORIGIN/api/health")
          echo "GET /api/health -> $status"
          cat /tmp/health.json; echo
          if [ "$status" != "200" ]; then
            body=$(head -c 300 /tmp/health.json | tr '\n\r' '  ')
            echo "::error title=Health check failed::GET $API_ORIGIN/api/health returned HTTP $status. Body: $body"
            exit 1
          fi
