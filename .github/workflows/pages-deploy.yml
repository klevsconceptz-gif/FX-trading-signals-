# Publishes the dashboard (the Pages site and its /api proxy) on every push to main that changes it,
# and on a manual run. It does not touch the Worker, its migrations, or its secrets: those stay in
# cloudflare-deploy.yml. Secrets are read from the production environment and never printed.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - "functions/**"
      - "scripts/build-static.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the Pages site
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'klv-fx-trading-signals' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Check Cloudflare secrets are set
        run: |
          missing=0
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            v="${!n}"
            if [ -z "$v" ]; then
              echo "$n: EMPTY"
              echo "::error title=Cloudflare secret missing::$n is empty in the production environment"
              missing=1
            else
              echo "$n: set, length ${#v}"
            fi
          done
          exit $missing

      # Only a deploy to the project's production branch replaces the public site. Any other branch
      # name makes a preview, so the production branch is read from the project first.
      - name: Deploy the Pages site
        run: |
          set -uo pipefail
          prod_branch=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PAGES_PROJECT" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("result", {}).get("production_branch", ""))' 2>/dev/null || true)
          prod_branch=${prod_branch:-main}
          echo "Pages project $CLOUDFLARE_PAGES_PROJECT: production branch is $prod_branch"
          # Run from the repository root: Wrangler uploads the functions/ folder next to dist/.
          npx wrangler pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$prod_branch" --commit-hash "$GITHUB_SHA" > /tmp/pages-deploy.log 2>&1
          status=$?
          cat /tmp/pages-deploy.log
          url=$(grep -o 'https://[^ ]*pages.dev[^ ]*' /tmp/pages-deploy.log | head -n 1 || true)
          if [ -n "$url" ]; then echo "::notice title=Pages deployment::$url (branch $prod_branch)"; fi
          if [ "$status" != "0" ]; then
            reason=$(grep -v '^[[:space:]]*$' /tmp/pages-deploy.log | tail -n 3 | tr '\n' ' ' | cut -c1-400)
            echo "::error title=Pages deploy failed::wrangler exit $status: $reason"
            exit "$status"
          fi
