# Live check of sign-up and sign-in against the deployed public site (the URL users open).
# It creates one throwaway account named cichk<digits>, signs it in, reads /api/me, and signs out.
# The account is NOT deleted: it stays in production and must be removed by hand in the admin console.
# It uses no secrets, runs only on demand, and prints status codes, timings and short error bodies,
# never tokens or passwords. A Cloudflare "error code: 1102" (CPU limit) is reported as such.
name: Live sign-up and sign-in check

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Site to test (no trailing slash)'
        required: false
        default: 'https://fx-trading-signals.pages.dev'
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Sign up, sign in, sign out
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Run the check
        run: |
          set -uo pipefail
          BASE="${BASE_URL%/}"
          fail=0

          {
            echo "### Live sign-up and sign-in check"
            echo ""
            echo "Site: \`$BASE\`"
            echo ""
            echo "| Step | HTTP | Time | Note |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # One throwaway identity per run. Letters and digits only in the username.
          SUFFIX="$(date +%s | tail -c 7)$(printf '%04d' $((RANDOM % 10000)))"
          USERNAME="cichk${SUFFIX}"
          EMAIL="cichk-${SUFFIX}@example.com"
          PHONE="+1 555 $(printf '%07d' $(( (RANDOM * 32768 + RANDOM) % 10000000 )))"
          PASSWORD="Chk-$(openssl rand -hex 8)Aa1!"
          echo "::add-mask::$PASSWORD"

          # call NAME METHOD PATH [JSON] [TOKEN] -> sets CODE and BODY_FILE. Bodies are not printed on success.
          call() {
            local name=$1 method=$2 path=$3 data=${4:-} token=${5:-}
            local out="/tmp/$name.json" code start end secs note=""
            local args=(-sS -o "$out" -w '%{http_code}' -X "$method" --max-time 60 -H 'Accept: application/json')
            [ -n "$data" ] && args+=(-H 'Content-Type: application/json' --data "$data")
            [ -n "$token" ] && args+=(-H "Authorization: Bearer $token")
            start=$(date +%s%N)
            code=$(curl "${args[@]}" "$BASE$path" 2>/tmp/"$name".err)
            code=${code:-000}
            end=$(date +%s%N)
            secs=$(awk -v a="$start" -v b="$end" 'BEGIN { printf "%.2f", (b - a) / 1e9 }')
            if [[ "$code" != 2* ]]; then
              note=$(head -c 160 "$out" 2>/dev/null | tr '\n\r|' '   ')
              if grep -q '1102' "$out" 2>/dev/null; then
                note="CPU limit (error 1102): $note"
                echo "::error title=CPU limit on $name::Cloudflare reported error 1102 on $method $path. The Free plan's 10 ms CPU limit is being exceeded."
              fi
            fi
            echo "$name: HTTP $code in ${secs}s"
            echo "| $name | $code | ${secs}s | ${note:-ok} |" >> "$GITHUB_STEP_SUMMARY"
            CODE=$code
            BODY_FILE=$out
          }

          call health GET /api/health
          call register POST /api/register "$(jq -cn --arg u "$USERNAME" --arg e "$EMAIL" --arg p "$PHONE" --arg pw "$PASSWORD" '{username:$u,email:$e,phone:$p,password:$pw}')"
          if [ "$CODE" != "200" ]; then fail=1; echo "::error title=Sign-up failed::HTTP $CODE from /api/register"; fi
          USER_ID=$(jq -r '.user.id // empty' "$BODY_FILE" 2>/dev/null)

          call login POST /api/auth/login "$(jq -cn --arg i "$USERNAME" --arg pw "$PASSWORD" '{identifier:$i,password:$pw}')"
          if [ "$CODE" != "200" ]; then fail=1; echo "::error title=Sign-in failed::HTTP $CODE from /api/auth/login"; fi
          TOKEN=$(jq -r '.token // empty' "$BODY_FILE" 2>/dev/null)
          echo "::add-mask::$TOKEN"

          if [ -n "$TOKEN" ]; then
            call me GET /api/me "" "$TOKEN"
            if [ "$CODE" != "200" ] || [ "$(jq -r '.user.username // empty' "$BODY_FILE")" != "$USERNAME" ]; then
              fail=1; echo "::error title=Session check failed::/api/me did not return the test account"
            fi
            call logout POST /api/auth/logout "{}" "$TOKEN"
          else
            fail=1
          fi

          # The test account is left in place on purpose; no admin secrets are used.
          if [ -n "$USER_ID" ]; then
            echo "::warning title=Test account left in place::Account cichk* (user id $USER_ID) was created on $BASE. Remove it by hand in the admin console."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Test account left in place: user id \`$USER_ID\`, name \`cichk*\`. Remove it in the admin console." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Result: FAILED.** See the rows above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Result: sign-up and sign-in work on \`$BASE\`.**" >> "$GITHUB_STEP_SUMMARY"
