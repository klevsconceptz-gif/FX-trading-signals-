# Read-only check of the production admin secrets against the rules the Worker enforces.
# It deploys nothing. It prints only pass or fail for each rule, never a value or a length.
name: Check admin secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check admin secrets
    runs-on: ubuntu-latest
    environment: production
    env:
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_EMAIL_ADDRESS: ${{ secrets.ADMIN_EMAIL_ADDRESS }}
    steps:
      - name: Check each rule
        run: |
          node -e '
            const pass = (b) => (b ? "pass" : "FAIL");
            const notice = (title, ok) => console.log(`::notice title=${title}::${pass(ok)}`);
            const username = process.env.ADMIN_USERNAME || "";
            const password = process.env.ADMIN_PASSWORD || "";
            const email = process.env.ADMIN_EMAIL_ADDRESS || "";

            // Same rules as worker/src/security.js and worker/src/auth.js.
            notice("ADMIN_USERNAME is set", username.length > 0);
            notice("ADMIN_USERNAME format (3-32 of A-Z a-z 0-9 _ . -)", /^[A-Za-z0-9_.-]{3,32}$/.test(username));
            notice("ADMIN_PASSWORD is set", password.length > 0);
            notice("ADMIN_PASSWORD at least 10 characters", password.length >= 10);
            notice("ADMIN_PASSWORD has an uppercase letter (A-Z)", /[A-Z]/.test(password));
            notice("ADMIN_PASSWORD has a lowercase letter (a-z)", /[a-z]/.test(password));
            notice("ADMIN_PASSWORD has a number (0-9)", /[0-9]/.test(password));
            notice("ADMIN_PASSWORD has a symbol", /[^A-Za-z0-9]/.test(password));
            notice("ADMIN_EMAIL_ADDRESS is set", email.length > 0);
            notice("ADMIN_EMAIL_ADDRESS format", /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) && email.length <= 200);
          '
