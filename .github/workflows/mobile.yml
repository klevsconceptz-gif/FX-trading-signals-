# Builds the Android and iOS apps. Each app is a Capacitor shell around the same web app as the
# Cloudflare Pages site, and it calls the Cloudflare Worker API.
#
# Artifacts only: nothing is uploaded to Google Play or the App Store. A tag named mobile-v* also
# attaches the files to a GitHub release.
#
# Android: an APK. It is signed with the release keystore when the keystore secrets are set,
#          and otherwise with the debug key, which still installs on a device.
# iOS:     an unsigned .app (always), and an .ipa when the Apple signing secrets are set.
#
# Secrets are passed to steps as environment variables. Keystore, certificate and profile files are
# written under $RUNNER_TEMP and deleted at the end of the job. Nothing secret is committed.
name: Mobile apps

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Worker origin the apps call (https, no path). Empty uses the KLEVS_API_ORIGIN variable or the default."
        required: false
        default: ""
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Build the web bundle and sync Android
        env:
          KLEVS_API_ORIGIN: ${{ inputs.api_origin || vars.KLEVS_API_ORIGIN }}
        run: |
          npm run build:mobile
          npx cap sync android
      - name: Decode the release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/klevs-release.jks"
          echo "KLEVS_KEYSTORE_PATH=$RUNNER_TEMP/klevs-release.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: android
        env:
          KLEVS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KLEVS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KLEVS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PklevsVersionCode=${{ github.run_number }} --no-daemon
      - name: Collect the APK
        run: |
          mkdir -p dist-mobile
          cp android/app/build/outputs/apk/release/app-release.apk "dist-mobile/klevs-fx-${{ github.run_number }}-android.apk"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/klevs-release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist-mobile/*.apk
          if-no-files-found: error

  ios:
    name: iOS app
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'ad-hoc' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web bundle and sync iOS
        env:
          KLEVS_API_ORIGIN: ${{ inputs.api_origin || vars.KLEVS_API_ORIGIN }}
        run: |
          npm run build:mobile
          npx cap sync ios
      - name: Build the unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Collect the unsigned app
        run: |
          mkdir -p dist-mobile
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" \
            "dist-mobile/klevs-fx-${{ github.run_number }}-ios-unsigned.app.zip"
      - name: Sign and export the IPA
        if: env.IOS_CERT_P12_BASE64 != '' && env.IOS_PROFILE_BASE64 != '' && env.IOS_TEAM_ID != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/klevs-build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/klevs-cert.p12"
          security import "$RUNNER_TEMP/klevs-cert.p12" -k "$KEYCHAIN" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/klevs.mobileprovision"
          PROFILE_UUID="$(security cms -D -i "$RUNNER_TEMP/klevs.mobileprovision" | plutil -extract UUID raw -)"
          PROFILE_NAME="$(security cms -D -i "$RUNNER_TEMP/klevs.mobileprovision" | plutil -extract Name raw -)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/klevs.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${IOS_EXPORT_METHOD}</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.klevs.fxtrading</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP"/ipa/*.ipa "dist-mobile/klevs-fx-${{ github.run_number }}-ios.ipa"
      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/klevs-cert.p12" "$RUNNER_TEMP/klevs.mobileprovision" "$RUNNER_TEMP/ExportOptions.plist"
          security delete-keychain "$RUNNER_TEMP/klevs-build.keychain-db" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: ios-app
          path: dist-mobile/*
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*"
          merge-multiple: true
          path: dist-mobile
      - name: Create the release if needed and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --prerelease \
              --notes "Mobile builds. Artifacts only: these files are not uploaded to any app store."
          fi
          gh release upload "$TAG" dist-mobile/* --clobber
