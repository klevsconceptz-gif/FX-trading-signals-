# Publishes the latest live FX signals to Cloudflare D1 every hour. The Worker serves the stored
# snapshot to paid users. GitHub runs scheduled workflows only from the default branch, so this
# schedule takes effect after the branch is merged. Start it manually before then.
#
# The publisher refuses to write anything that is not live market data. In that case the job
# fails and the last live snapshot stays in place.
name: Publish signals

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-signals
  cancel-in-progress: false

jobs:
  publish:
    name: Publish live signals
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KFX_LIVE_DATA: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-live.txt
      - name: Publish the latest live snapshot to D1
        run: python -m scripts.publish_signals

      - name: Post new signals to the Telegram channel
        # Runs only after a successful publish. The Worker posts only new or changed signals and
        # keeps the dedupe state in D1, so a repeat run is harmless.
        if: success()
        env:
          TELEGRAM_POST_SECRET: ${{ secrets.TELEGRAM_POST_SECRET }}
          API_ORIGIN: ${{ vars.KLEVS_API_ORIGIN || 'https://fx-trading-signals.klevco.workers.dev' }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_POST_SECRET" ]; then
            echo "skip Telegram posting (TELEGRAM_POST_SECRET not set)"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$API_ORIGIN/api/internal/telegram/post" \
            -H "Authorization: Bearer $TELEGRAM_POST_SECRET" -o /tmp/telegram-post.json
          cat /tmp/telegram-post.json; echo
