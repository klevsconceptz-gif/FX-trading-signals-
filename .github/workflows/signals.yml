# Publishes the latest live FX signals to Cloudflare D1 twice a day: 8am and 7pm Eastern. GitHub
# schedules run in UTC, and Eastern time shifts between summer and winter, so both UTC pairs run
# and the gate job keeps only the run whose Eastern hour is 08 or 19. A manual run always publishes.
# The Worker serves the stored snapshot to paid users. GitHub runs scheduled workflows only from
# the default branch, so the schedule takes effect after the branch is merged.
#
# The publisher refuses to write anything that is not live market data. In that case the job
# fails and the last live snapshot stays in place.
name: Publish signals

on:
  schedule:
    - cron: "5 12,13 * * *"   # 8am Eastern: 12:05 UTC in summer, 13:05 UTC in winter
    - cron: "5 23,0 * * *"    # 7pm Eastern: 23:05 UTC in summer, 00:05 UTC in winter
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-signals
  cancel-in-progress: false

jobs:
  gate:
    name: Keep the run at 8am or 7pm Eastern
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/New_York date +%H)
          case "$hour" in
            08|19) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; echo "Eastern hour is $hour; the publish runs at 08 and 19." ;;
          esac

  publish:
    name: Publish live signals
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KFX_LIVE_DATA: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-live.txt
      - name: Publish the latest live snapshot to D1 and post new signals to Telegram
        # After a successful D1 write, the script posts new or changed signals straight to the
        # Telegram Bot API. A Telegram failure is reported in the log and does not fail the publish.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.publish_signals
