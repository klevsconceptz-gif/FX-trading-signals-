# One-time cleanup: removes the retired admin secrets from the API Worker.
# The admin account now uses ADMIN_USERNAME and ADMIN_PASSWORD. Nothing in the code reads the old
# KFX_ADMIN_USERNAME, KFX_ADMIN_PASSWORD or KFX_ADMIN_PASSWORD_HASH names, and this job refuses to run
# if any of them is still referenced in worker/src. It deletes only the names that are present, prints
# only names and outcomes, never values, and is safe to re-run.
# It runs only on demand, only from main, and only when the confirmation text is typed exactly.
name: Delete old admin secrets

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: DELETE OLD ADMIN SECRETS'
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete:
    name: Delete retired admin secrets
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DELETE OLD ADMIN SECRETS'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refuse if the code still reads a retired name
        run: |
          if grep -rn "KFX_ADMIN_USERNAME\|KFX_ADMIN_PASSWORD" worker/src; then
            echo "::error title=Retired name still in use::worker/src still reads a retired admin secret. Not deleting anything."
            exit 1
          fi
          echo "No code reads the retired admin secret names."

      - name: List the Worker's current secret names
        run: |
          npx wrangler secret list --config worker/wrangler.jsonc --format json > /tmp/secrets.json
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("/tmp/secrets.json", "utf8");
            const a = s.indexOf("["), b = s.lastIndexOf("]");
            const list = a < 0 ? [] : JSON.parse(s.slice(a, b + 1));
            fs.writeFileSync("/tmp/secret-names.txt", list.map((x) => x.name).join("\n") + "\n");
            console.log("Secrets on the Worker: " + list.length);
          '

      - name: Delete each retired name that is present
        run: |
          for n in KFX_ADMIN_USERNAME KFX_ADMIN_PASSWORD KFX_ADMIN_PASSWORD_HASH; do
            if grep -qx "$n" /tmp/secret-names.txt; then
              if npx wrangler secret delete "$n" --config worker/wrangler.jsonc; then
                echo "deleted $n"
              else
                echo "::error title=Delete failed::Could not delete $n (see the step log above)"
                exit 1
              fi
            else
              echo "absent $n (nothing to delete)"
            fi
          done

      - name: Confirm what remains
        run: |
          npx wrangler secret list --config worker/wrangler.jsonc --format json > /tmp/after.json
          node -e '
            const fs = require("fs");
            const s = fs.readFileSync("/tmp/after.json", "utf8");
            const a = s.indexOf("["), b = s.lastIndexOf("]");
            const names = (a < 0 ? [] : JSON.parse(s.slice(a, b + 1))).map((x) => x.name);
            const retired = ["KFX_ADMIN_USERNAME", "KFX_ADMIN_PASSWORD", "KFX_ADMIN_PASSWORD_HASH"];
            const still = retired.filter((n) => names.includes(n));
            console.log("Retired names still on the Worker: " + (still.length ? still.join(", ") : "none"));
            if (still.length) process.exit(1);
          '
